<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>酒店销售情报日历</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#2c3e50;}

.header{background:#1a1a2e;padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.logo{color:#fff;font-size:17px;font-weight:700;white-space:nowrap;}
.logo em{color:#f0a500;font-style:normal;}
.header select,.header input{padding:6px 10px;border-radius:5px;border:none;font-size:13px;outline:none;background:#16213e;color:#fff;}
.header select{cursor:pointer;}
.header .nav-link{color:#f0a500;font-size:12px;text-decoration:none;margin-left:auto;}
.header .nav-link:hover{text-decoration:underline;}

.loading{text-align:center;padding:60px 20px;color:#999;font-size:15px;}
.loading .spinner{display:inline-block;width:30px;height:30px;border:3px solid #e0e0e0;border-top-color:#f0a500;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:10px;}
@keyframes spin{to{transform:rotate(360deg);}}
.error{text-align:center;padding:60px 20px;color:#e74c3c;}
.error button{margin-top:12px;padding:8px 20px;border:none;background:#f0a500;color:#fff;border-radius:5px;cursor:pointer;font-size:14px;}

.wrap{max-width:1260px;margin:0 auto;padding:14px;display:flex;gap:14px;align-items:flex-start;}

/* 日历 */
.cal{flex:1;background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.cal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.cal-top h2{font-size:17px;}
.cal-nav{display:flex;gap:5px;align-items:center;}
.cal-nav button{border:none;background:#f0f0f0;width:28px;height:28px;border-radius:5px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;}
.cal-nav button:hover{background:#e0e0e0;}
.cal-nav .bt{border:none;background:#f0a500;color:#fff;padding:0 10px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:500;height:28px;}

.wdays{display:flex;background:#f7f8fa;border-radius:5px;margin-bottom:4px;}
.wdays span{flex:1;text-align:center;font-size:12px;color:#999;font-weight:600;padding:6px 0;}
.wdays .w6{color:#4a90d9;}
.wdays .w7{color:#e74c3c;}

.days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.d{background:#fafafa;min-height:85px;padding:3px 4px;cursor:pointer;border-radius:4px;overflow:hidden;display:flex;flex-direction:column;border:1px solid #eee;}
.d:hover{background:#f0f4ff;}
.d.other{background:#f7f7f7;}
.d.other .dn{color:#ccc;}
.d.today{background:#eaf3fb;border-color:#4a90d9;}
.dn{font-size:13px;font-weight:500;color:#555;margin-bottom:2px;flex-shrink:0;line-height:1.6;}
.d.today .dn{background:#4a90d9;color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
.ev{flex:1;display:flex;flex-direction:column;gap:1px;overflow:hidden;}
.et{font-size:10px;padding:0 3px;border-radius:2px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.7;flex-shrink:0;}
.t1{background:#4a90d9;}
.t2{background:#9b59b6;}
.t3{background:#27ae60;}
.t4{background:#e67e22;}
.t5{background:#e74c3c;}
.t6{background:#f39c12;}
.t7{background:#7f8c8d;}
.em{font-size:10px;color:#aaa;padding:0 3px;}

/* 右侧 */
.side{width:310px;flex-shrink:0;display:flex;flex-direction:column;gap:12px;}
.card{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.card h3{font-size:14px;margin-bottom:10px;color:#1a1a2e;padding-bottom:6px;border-bottom:2px solid #f0a500;}
.st{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.sti{text-align:center;padding:6px 2px;border-radius:5px;background:#f8f9fa;}
.sti .n{font-size:19px;font-weight:700;}
.sti .l{font-size:11px;color:#888;margin-top:1px;}
.sti.x1 .n{color:#4a90d9;}
.sti.x2 .n{color:#9b59b6;}
.sti.x3 .n{color:#27ae60;}
.sti.x4 .n{color:#e67e22;}
.sti.x5 .n{color:#e74c3c;}
.sti.x6 .n{color:#f39c12;}
.sti.x7{background:#fff8e1;}
.sti.x7 .n{color:#f0a500;}
.ft{display:flex;flex-wrap:wrap;gap:4px;}
.ft span{padding:3px 8px;border-radius:10px;font-size:11px;cursor:pointer;border:1px solid #ddd;background:#fff;user-select:none;}
.ft span.on{color:#fff;border-color:transparent;}
.ft span.on.t1{background:#4a90d9;}
.ft span.on.t2{background:#9b59b6;}
.ft span.on.t3{background:#27ae60;}
.ft span.on.t4{background:#e67e22;}
.ft span.on.t5{background:#e74c3c;}
.ft span.on.t6{background:#f39c12;}
.ft span.on.t7{background:#7f8c8d;}
.el{list-style:none;}
.el li{padding:6px 0;border-bottom:1px solid #f0f0f0;cursor:pointer;font-size:13px;}
.el li:hover{color:#4a90d9;}
.el li:last-child{border-bottom:none;}
.el .ed{font-size:11px;color:#aaa;}
.el .etag{display:inline-block;font-size:10px;padding:1px 5px;border-radius:2px;color:#fff;margin-right:3px;vertical-align:middle;}

/* 弹窗 */
.mask{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:200;justify-content:center;align-items:center;}
.mask.show{display:flex;}
.modal{background:#fff;border-radius:14px;padding:24px;max-width:500px;width:92%;box-shadow:0 16px 48px rgba(0,0,0,0.15);max-height:80vh;overflow-y:auto;position:relative;}
.modal .x{position:absolute;top:12px;right:16px;border:none;background:none;font-size:22px;cursor:pointer;color:#999;}
.modal .x:hover{color:#333;}
.modal .mtag{display:inline-block;padding:3px 10px;border-radius:4px;font-size:12px;color:#fff;font-weight:500;margin-bottom:8px;}
.modal .mtt{font-size:19px;font-weight:700;margin:6px 0 12px;padding-right:24px;}
.modal .mr{font-size:14px;color:#555;padding:3px 0;}
.modal .mr b{color:#333;}
.modal .msrc{background:#f8f9fa;padding:10px 12px;border-radius:8px;font-size:13px;margin:12px 0;word-break:break-all;}
.modal .msrc a{color:#4a90d9;}
.modal .mad{background:#fff8e1;padding:12px;border-radius:8px;border-left:3px solid #f0a500;font-size:13px;color:#5d4037;line-height:1.7;}

@media(max-width:860px){
  .wrap{flex-direction:column;}
  .side{width:100%;}
}
</style>
</head>
<body>

<div class="header">
  <div class="logo"><em>酒店销售情报</em>日历</div>
  <select id="province"><option value="全部">全部省份</option></select>
  <select id="city"><option value="全部">全部城市</option></select>
  <a class="nav-link" href="/hotel" target="_blank">项目简介 →</a>
</div>

<div id="loading" class="loading"><div class="spinner"></div><div>正在加载数据...</div></div>
<div id="error" class="error" style="display:none"><div>数据加载失败</div><button onclick="loadData()">重试</button></div>

<div class="wrap" id="main" style="display:none">
  <div class="cal">
    <div class="cal-top">
      <h2 id="ct">2026年8月</h2>
      <div class="cal-nav">
        <button onclick="pm()">◀</button>
        <button class="bt" onclick="gt()">今天</button>
        <button onclick="nm()">▶</button>
      </div>
    </div>
    <div class="wdays">
      <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span>
      <span class="w6">六</span><span class="w7">日</span>
    </div>
    <div class="days" id="g"></div>
  </div>

  <div class="side">
    <div class="card">
      <h3>本月统计</h3>
      <div class="st" id="st"></div>
    </div>
    <div class="card">
      <h3>事件类型</h3>
      <div class="ft" id="ft"></div>
    </div>
    <div class="card">
      <h3>近期重点事件</h3>
      <ul class="el" id="el"></ul>
    </div>
  </div>
</div>

<div class="mask" id="mk" onclick="cm(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <button class="x" onclick="cm()">&times;</button>
    <div class="mtag" id="mt"></div>
    <div class="mtt" id="mtt"></div>
    <div class="mr" id="md"></div>
    <div class="mr" id="mc"></div>
    <div class="mr" id="ml"></div>
    <div class="mr" id="ms"></div>
    <div class="msrc" id="msrc"></div>
    <div class="mad" id="mad"></div>
  </div>
</div>

<script>
// ========== 配置区 ==========
var DATABASE_ID = '749bea0bcb8e82c6928801323a7bad3c';
var API_URL = '/api/notion-proxy';

// 省份-城市映射（后续加省份只需在这里加）
var provinceCities = {
  "广西": ["南宁","桂林","柳州","北海","玉林","百色","梧州","防城港","钦州","贵港","贺州","河池","来宾","崇左"]
};

// 事件类型映射
var typeMap = {
  "展会": "t1","演出": "t2","赛事": "t3","会议": "t4","考试": "t5","节庆": "t6","其他": "t7"
};
var typeLabels = ["展会","演出","赛事","会议","考试","节庆","其他"];
var typeKeys = ["t1","t2","t3","t4","t5","t6","t7"];

// ========== 数据 ==========
var allEvents = [];
var Y = 2026, M = 8;
var activeFilters = new Set(typeKeys);

// ========== Notion 数据解析 ==========
function getProp(props, name) {
  var p = props[name];
  if (!p) return null;
  switch(p.type) {
    case 'title': return p.title.map(function(t){return t.plain_text;}).join('');
    case 'rich_text': return p.rich_text.map(function(t){return t.plain_text;}).join('');
    case 'date': return p.date ? p.date.start : null;
    case 'select': return p.select ? p.select.name : null;
    case 'multi_select': return p.multi_select.map(function(s){return s.name;});
    case 'url': return p.url || null;
    case 'number': return p.number;
    default: return null;
  }
}

function parseEvent(page) {
  var props = page.properties;
  var rawType = getProp(props, '类型') || getProp(props, 'tags');
  var typeLabel = '';
  var typeKey = 't7';
  if (rawType) {
    if (Array.isArray(rawType)) { rawType = rawType[0]; }
    typeLabel = rawType;
    typeKey = typeMap[rawType] || 't7';
  }

  var dateVal = getProp(props, '日期') || getProp(props, 'date');
  if (!dateVal) return null;

  return {
    id: page.id,
    d: dateVal.substring(0, 10),
    province: getProp(props, '省份') || '广西',
    city: getProp(props, '城市') || '',
    t: typeKey,
    l: typeLabel || '其他',
    tt: getProp(props, '标题') || getProp(props, 'title') || getProp(props, 'Name') || '未命名',
    s: getProp(props, '简介') || getProp(props, 'summary') || '',
    loc: getProp(props, '地点') || '',
    src: getProp(props, '信源链接') || '',
    ad: getProp(props, '分析建议') || ''
  };
}

// ========== 数据加载 ==========
function loadData() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('error').style.display = 'none';
  document.getElementById('main').style.display = 'none';

  fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ database_id: DATABASE_ID })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.error) throw new Error(data.error);
    allEvents = [];
    if (data.results) {
      data.results.forEach(function(page) {
        var ev = parseEvent(page);
        if (ev) allEvents.push(ev);
      });
    }
    initProvinceSelect();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('main').style.display = 'flex';
    R();
  })
  .catch(function(e) {
    console.error(e);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
  });
}

// ========== 省份/城市选择 ==========
function initProvinceSelect() {
  var ps = document.getElementById('province');
  ps.innerHTML = '<option value="全部">全部省份</option>';
  var provinces = Object.keys(provinceCities);
  provinces.forEach(function(p) {
    ps.innerHTML += '<option value="' + p + '">' + p + '</option>';
  });
  ps.onchange = function() {
    updateCitySelect();
    R();
  };
  updateCitySelect();
}

function updateCitySelect() {
  var cs = document.getElementById('city');
  var pv = document.getElementById('province').value;
  cs.innerHTML = '<option value="全部">全部城市</option>';
  if (pv !== '全部' && provinceCities[pv]) {
    provinceCities[pv].forEach(function(c) {
      cs.innerHTML += '<option value="' + c + '">' + c + '</option>';
    });
  }
  cs.onchange = function() { R(); };
}

// ========== 事件过滤 ==========
function FE() {
  var pv = document.getElementById('province').value;
  var cv = document.getElementById('city').value;
  return allEvents.filter(function(e) {
    if (!activeFilters.has(e.t)) return false;
    if (pv !== '全部' && e.province !== pv) return false;
    if (cv !== '全部' && e.city !== cv) return false;
    return true;
  });
}

function GD(ds) {
  return FE().filter(function(e) { return e.d === ds; });
}

// ========== 日历渲染 ==========
function p2(n) { return n < 10 ? '0' + n : '' + n; }

function R() {
  document.getElementById('ct').textContent = Y + '年' + M + '月';
  var grid = document.getElementById('g');
  grid.innerHTML = '';
  var fd = new Date(Y, M - 1, 1);
  var ld = new Date(Y, M, 0);
  var sd = (fd.getDay() + 6) % 7;
  var dim = ld.getDate();
  var pld = new Date(Y, M - 1, 0).getDate();
  var td = new Date();
  var ts = td.getFullYear() + '-' + p2(td.getMonth() + 1) + '-' + p2(td.getDate());

  for (var i = sd - 1; i >= 0; i--) {
    var dd = pld - i;
    var ym = M === 1 ? 12 : M - 1;
    var yy = M === 1 ? Y - 1 : Y;
    grid.appendChild(C(dd, yy + '-' + p2(ym) + '-' + p2(dd), true, ts));
  }
  for (var d = 1; d <= dim; d++) {
    grid.appendChild(C(d, Y + '-' + p2(M) + '-' + p2(d), false, ts));
  }
  var tot = sd + dim;
  var rm = (7 - tot % 7) % 7;
  for (var d = 1; d <= rm; d++) {
    var ym = M === 12 ? 1 : M + 1;
    var yy = M === 12 ? Y + 1 : Y;
    grid.appendChild(C(d, yy + '-' + p2(ym) + '-' + p2(d), true, ts));
  }
  RS();
  RL();
}

function C(n, ds, io, ts) {
  var div = document.createElement('div');
  div.className = 'd';
  if (io) div.classList.add('other');
  if (ds === ts) div.classList.add('today');
  var num = document.createElement('div');
  num.className = 'dn';
  num.textContent = n;
  div.appendChild(num);
  var evs = GD(ds);
  var evd = document.createElement('div');
  evd.className = 'ev';
  if (evs.length > 0) {
    evs.slice(0, 3).forEach(function(e) {
      var tag = document.createElement('div');
      tag.className = 'et ' + e.t;
      tag.textContent = e.tt;
      evd.appendChild(tag);
    });
    if (evs.length > 3) {
      var m = document.createElement('div');
      m.className = 'em';
      m.textContent = '+' + (evs.length - 3) + ' 条更多';
      evd.appendChild(m);
    }
    div.appendChild(evd);
    div.onclick = function() { OD(evs[0]); };
  } else {
    evd.style.flex = '1';
    div.appendChild(evd);
  }
  return div;
}

// ========== 弹窗 ==========
function OD(ev) {
  document.getElementById('mt').className = 'mtag ' + ev.t;
  document.getElementById('mt').textContent = ev.l;
  document.getElementById('mtt').textContent = ev.tt;
  document.getElementById('md').innerHTML = '<b>时间：</b>' + ev.d;
  document.getElementById('mc').innerHTML = '<b>城市：</b>' + (ev.province ? ev.province + ' · ' : '') + (ev.city || '未知');
  document.getElementById('ml').innerHTML = ev.loc ? '<b>地点：</b>' + ev.loc : '';
  document.getElementById('ms').innerHTML = ev.s ? '<b>简介：</b>' + ev.s : '';
  document.getElementById('msrc').innerHTML = ev.src ? '<b>官方信源：</b> <a href="' + ev.src + '" target="_blank">' + ev.src + '</a>' : '';
  document.getElementById('mad').innerHTML = ev.ad ? '<b>分析建议：</b>' + ev.ad : '';
  document.getElementById('mk').classList.add('show');
}

function cm(e) {
  if (e && e.target !== document.getElementById('mk')) return;
  document.getElementById('mk').classList.remove('show');
}

// ========== 月份切换 ==========
function pm() { if (M === 1) { M = 12; Y--; } else { M--; } R(); }
function nm() { if (M === 12) { M = 1; Y++; } else { M++; } R(); }
function gt() { var t = new Date(); Y = t.getFullYear(); M = t.getMonth() + 1; R(); }

// ========== 统计 ==========
function RS() {
  var fe = FE();
  var mp = Y + '-' + p2(M);
  var me = fe.filter(function(e) { return e.d.indexOf(mp) === 0; });
  var ct = { t1: 0, t2: 0, t3: 0, t4: 0, t5: 0, t6: 0, t7: 0 };
  me.forEach(function(e) { if (ct[e.t] !== undefined) ct[e.t]++; });
  var total = 0;
  for (var k in ct) total += ct[k];
  document.getElementById('st').innerHTML =
    '<div class="sti x1"><div class="n">' + ct.t1 + '</div><div class="l">展会</div></div>' +
    '<div class="sti x2"><div class="n">' + ct.t2 + '</div><div class="l">演出</div></div>' +
    '<div class="sti x3"><div class="n">' + ct.t3 + '</div><div class="l">赛事</div></div>' +
    '<div class="sti x4"><div class="n">' + ct.t4 + '</div><div class="l">会议</div></div>' +
    '<div class="sti x5"><div class="n">' + ct.t5 + '</div><div class="l">考试</div></div>' +
    '<div class="sti x6"><div class="n">' + ct.t6 + '</div><div class="l">节庆</div></div>' +
    '<div class="sti x7" style="grid-column:1/-1;"><div class="n">' + total + '</div><div class="l">本月合计</div></div>';
}

function RL() {
  var mp = Y + '-' + p2(M);
  var me = FE().filter(function(e) { return e.d.indexOf(mp) === 0; });
  me.sort(function(a, b) { return a.d.localeCompare(b.d); });
  var list = document.getElementById('el');
  list.innerHTML = '';
  me.slice(0, 10).forEach(function(e) {
    var li = document.createElement('li');
    li.innerHTML = '<div class="ed">' + e.d + ' · ' + e.city + '</div><span class="etag ' + e.t + '">' + e.l + '</span>' + e.tt;
    li.onclick = function() { OD(e); };
    list.appendChild(li);
  });
}

// ========== 类型筛选 ==========
(function() {
  var ft = document.getElementById('ft');
  typeLabels.forEach(function(lb, i) {
    var sp = document.createElement('span');
    sp.className = typeKeys[i] + ' on';
    sp.textContent = lb;
    sp.onclick = function() {
      this.classList.toggle('on');
      if (this.classList.contains('on')) {
        activeFilters.add(typeKeys[i]);
      } else {
        activeFilters.delete(typeKeys[i]);
      }
      R();
    };
    ft.appendChild(sp);
  });
})();

// ========== 启动 ==========
loadData();
</script>
</body>
</html>
